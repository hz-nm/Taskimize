# Optional hot-reload setup:  docker compose -f docker-compose.dev.yml up --build
# Backend reloads on save; frontend runs the Vite dev server instead of nginx.
services:
  backend:
    build: ./backend
    container_name: task-optimizer-backend-dev
    environment:
      DATABASE_PATH: /data/tasks.db
    volumes:
      - task-data-dev:/data
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:20-alpine
    container_name: task-optimizer-frontend-dev
    working_dir: /app
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  task-data-dev:
