<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Optimizer</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint so dark mode never flashes white.
      (function () {
        var saved = localStorage.getItem('task-optimizer-theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.documentElement.style.background = theme === 'dark' ? '#1a1a1f' : '#fafafa'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
